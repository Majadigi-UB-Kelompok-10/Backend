name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services (ignore changed files detection)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:

  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-services.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            bapenda-service:
              - 'bapenda-service/**'
            klinik-service:
              - 'klinik-service/**'
            sidita-service:
              - 'sidita-service/**'
            siskaperbapo-service:
              - 'siskaperbapo-service/**'
            rssa-service:
              - 'rssa-service/**'
            user-service:
              - 'user-service/**'
            sinaker-service:
              - 'sinaker-service/**'
            transjatim-service:
              - 'transjatim-service/**'
            jdih-service:
              - 'jdih-service/**'
            bansos-service:
              - 'bansos-service/**'

      - name: Set services output
        id: set-services
        env:
          BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.build_all == 'true' }}
          FILTER_OUTPUT: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$BUILD_ALL" = "true" ]; then
            echo 'services=["api-gateway","user-service","transjatim-service","bapenda-service","klinik-service","rssa-service","sidita-service","siskaperbapo-service","sinaker-service","jdih-service","bansos-service"]' >> $GITHUB_OUTPUT
          else
            echo "services=$FILTER_OUTPUT" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ matrix.service }}
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' && needs.detect.outputs.services != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '${{ matrix.service }}/go.mod'
          cache: true
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -o bin/api ./cmd/api

      - name: Verify binary
        run: ls -lh bin/api

  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [detect, build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/majadigi-ub-kelompok-10/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/majadigi-ub-kelompok-10/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [detect, build-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:
      - name: Deploy to Railway
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          npm install -g @railway/cli --silent
          railway redeploy --service "$SERVICE_NAME" --yes
