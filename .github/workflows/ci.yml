name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/**'

jobs:

  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway:
              - 'api-gateway/**'
            bapenda-service:
              - 'bapenda-service/**'
            klinik-service:
              - 'klinik-service/**'
            sidita-service:
              - 'sidita-service/**'
            siskaperbapo-service:
              - 'siskaperbapo-service/**'
            rssa-service:
              - 'rssa-service/**'
            user-service:
              - 'user-service/**'
            sinaker-service:
              - 'sinaker-service/**'
            transjatim-service:
              - 'transjatim-service/**'
            jdih-service:
              - 'jdih-service/**'
            bansos-service:
              - 'bansos-service/**'

  build:
    name: Build ${{ matrix.service }}
    needs: detect
    if: ${{ needs.detect.outputs.services != '[]' && needs.detect.outputs.services != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '${{ matrix.service }}/go.mod'
          cache: true
          cache-dependency-path: '${{ matrix.service }}/go.sum'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Build binary
        run: go build -o bin/api ./cmd/api

      - name: Verify binary
        run: ls -lh bin/api

  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: [detect, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/majadigi-ub-kelompok-10/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/majadigi-ub-kelompok-10/${{ matrix.service }}:latest

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [detect, build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect.outputs.services) }}
    env:
      HOOK_API_GATEWAY: ${{ secrets.RAILWAY_DEPLOY_HOOK_API_GATEWAY }}
      HOOK_USER_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_USER_SERVICE }}
      HOOK_TRANSJATIM_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_TRANSJATIM_SERVICE }}
      HOOK_BAPENDA_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_BAPENDA_SERVICE }}
      HOOK_KLINIK_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_KLINIK_SERVICE }}
      HOOK_RSSA_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_RSSA_SERVICE }}
      HOOK_SIDITA_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_SIDITA_SERVICE }}
      HOOK_SISKAPERBAPO_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_SISKAPERBAPO_SERVICE }}
      HOOK_SINAKER_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_SINAKER_SERVICE }}
      HOOK_JDIH_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_JDIH_SERVICE }}
      HOOK_BANSOS_SERVICE: ${{ secrets.RAILWAY_DEPLOY_HOOK_BANSOS_SERVICE }}

    steps:
      - name: Trigger Railway deploy
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          VAR_NAME="HOOK_$(echo "$SERVICE_NAME" | tr '[:lower:]-' '[:upper:]_')"
          HOOK_URL="${!VAR_NAME}"
          if [ -z "$HOOK_URL" ]; then
            echo "ERROR: No deploy hook configured for service: $SERVICE_NAME"
            echo "Add secret RAILWAY_DEPLOY_HOOK_$(echo "$SERVICE_NAME" | tr '[:lower:]-' '[:upper:]_') to this repo."
            exit 1
          fi
          echo "Deploying $SERVICE_NAME to Railway..."
          curl --fail --silent --show-error -X POST "$HOOK_URL"
          echo "Deploy triggered for $SERVICE_NAME"
