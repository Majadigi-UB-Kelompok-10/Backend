name: CI

# KAPAN workflow ini jalan
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # Job tunggal: build & vet
  build:
    name: Build & Vet
    runs-on: ubuntu-latest    # VM gratisan dari GitHub

    steps:
      # 1. Download kode dari repo ke VM
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Go (versinya ngikut go.mod kamu)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 3. Download semua library yang dipakai
      - name: Download dependencies
        run: go mod download

      # 4. Cek bug umum (shadowed vars, struct tag salah, dll)
      - name: Run go vet
        run: go vet ./...

      # 5. Coba compile — kalau error, workflow fail
      - name: Build binary
        run: go build -o bin/api ./cmd/api

      # 6. Konfirmasi binary berhasil dibuat
      - name: Verify binary exists
        run: ls -lh bin/api