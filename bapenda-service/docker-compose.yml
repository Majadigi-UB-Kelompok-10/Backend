services:
  bapenda-redis:
    image: redis:8.6
    container_name: bapenda-redis
    ports:
      - "6380:6379"
    volumes:
      - bapenda-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - capstone-global-network

  bapenda-db:
    image: postgres:18-alpine
    container_name: bapenda-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - bapenda-postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - capstone-global-network

  bapenda-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bapenda-api
    ports:
      - "4000:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=${ENVIRONMENT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
    volumes:
      - .:/app
    depends_on:
      - bapenda-db
      - bapenda-redis
    networks:
      - capstone-global-network
    restart: unless-stopped

volumes:
  bapenda-postgres-data:
  bapenda-redis-data:


