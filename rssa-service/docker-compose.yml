services:
  rssa-redis:
    image: redis:8.6
    container_name: rssa-redis
    ports:
      - "6383:6379"
    volumes:
      - rssa-redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - capstone-global-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rssa-db:
    image: postgres:18-alpine
    container_name: rssa-db
    command: postgres -c log_min_duration_statement=1000
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5436:5432"
    volumes:
      - rssa-postgres-data:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - capstone-global-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rssa-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: rssa-api
    ports:
      - "5002:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=${ENVIRONMENT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GATEWAY_DATABASE_URL=${GATEWAY_DATABASE_URL}
    volumes:
      - .:/app
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      rssa-db:
        condition: service_healthy
      rssa-redis:
        condition: service_healthy
    networks:
      - capstone-global-network
    restart: unless-stopped

volumes:
  rssa-postgres-data:
  rssa-redis-data:
  go-mod-cache:
  go-build-cache:
