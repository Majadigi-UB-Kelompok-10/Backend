services:
  redis:
    image: redis:7-alpine
    container_name: server-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: siskaperbapo-db
    environment:
      POSTGRES_USER: dzaky
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: siskaperbapo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzaky"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siskaperbapo-api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://dzaky:postgres@host.docker.internal:5432/siskaperbapo_db?pool_max_conns=50
      - REDIS_URL=redis://redis:6379/0
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  app-network:
    driver: bridge
